<!DOCTYPE html>
<html>
<head>
    <title>Party Creation Test</title>
</head>
<body>
    <h1>Party Creation Test</h1>
    <button onclick="testPartyCreation()">Test Create Party</button>
    <div id="results"></div>

    <script>
        // API helper function
        async function apiRequest(url, options) {
            console.log('apiRequest - URL:', url);
            console.log('apiRequest - Options:', options);
            
            const response = await fetch(url, {
                credentials: 'include',
                headers: {
                    'Content-Type': 'application/json',
                    ...options?.headers,
                },
                ...options,
            });

            console.log('apiRequest - Response status:', response.status);
            console.log('apiRequest - Response ok:', response.ok);

            if (!response.ok) {
                const error = await response.json().catch(() => ({ message: 'Request failed' }));
                console.error('apiRequest - Error response:', error);
                throw new Error(error.message || `HTTP error! status: ${response.status}`);
            }

            const result = await response.json();
            console.log('apiRequest - Success response:', result);
            return result;
        }

        // Check authentication
        async function checkAuth() {
            try {
                const user = await apiRequest('http://localhost:8000/api/auth/me');
                console.log('Authenticated as:', user);
                return true;
            } catch (error) {
                console.log('Not authenticated:', error.message);
                return false;
            }
        }

        // Login function
        async function login() {
            try {
                const result = await apiRequest('http://localhost:8000/api/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({
                        email: 'admin@test.com',
                        password: 'admin123'
                    })
                });
                console.log('Login successful:', result);
                return true;
            } catch (error) {
                console.error('Login failed:', error.message);
                return false;
            }
        }

        // Mock the party service function
        async function createParty(data) {
            // Map frontend field names to backend field names
            const backendData = {
                party_type: data.partyType,
                legal_name: data.legalName,
                trade_name: data.tradeName,
                gstin: data.gstin,
                address_line1: data.addressLine1,
                address_line2: data.addressLine2,
                city: data.city,
                state: data.state,
                pincode: data.pincode,
                country: data.country,
                contact_person: data.contactPerson,
                email: data.email,
                phone: data.phone,
                credit_limit: data.creditLimit,
                notes: data.notes,
            };
            
            console.log('createParty - Frontend data:', data);
            console.log('createParty - Backend data:', backendData);
            console.log('createParty - Sending to:', 'http://localhost:8000/api/v1/parties');
            
            const response = await fetch('http://localhost:8000/api/v1/parties', {
                method: 'POST',
                credentials: 'include',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(backendData),
            });

            console.log('apiRequest - Response status:', response.status);
            console.log('apiRequest - Response ok:', response.ok);

            if (!response.ok) {
                const error = await response.json().catch(() => ({ message: 'Request failed' }));
                console.error('apiRequest - Error response:', error);
                throw new Error(error.message || `HTTP error! status: ${response.status}`);
            }

            const result = await response.json();
            console.log('apiRequest - Success response:', result);
            return result;
        }

        async function testPartyCreation() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<p>Testing authentication...</p>';

            // Check if authenticated
            const isAuthenticated = await checkAuth();
            if (!isAuthenticated) {
                resultsDiv.innerHTML = '<p>Not authenticated, trying to login...</p>';
                const loginSuccess = await login();
                if (!loginSuccess) {
                    resultsDiv.innerHTML = '<p>Login failed. Cannot test party creation.</p>';
                    return;
                }
            }

            resultsDiv.innerHTML = '<p>Authenticated! Testing party creation...</p>';

            try {
                const testData = {
                    partyType: "supplier",
                    legalName: "HTML Test Party",
                    tradeName: "HTMLTP",
                    gstin: "",
                    addressLine1: "123 HTML Street",
                    addressLine2: "",
                    city: "Mumbai",
                    state: "Maharashtra",
                    pincode: "400001",
                    country: "India",
                    contactPerson: "HTML User",
                    email: "html@test.com",
                    phone: "9876543210",
                    creditLimit: 5000,
                    notes: "Test from HTML page"
                };

                const party = await createParty(testData);
                resultsDiv.innerHTML = `
                    <h3>SUCCESS!</h3>
                    <p>Party created with ID: ${party.id}</p>
                    <pre>${JSON.stringify(party, null, 2)}</pre>
                `;
            } catch (error) {
                resultsDiv.innerHTML = `
                    <h3>ERROR!</h3>
                    <p>${error.message}</p>
                    <p>Check browser console for detailed logs</p>
                `;
            }
        }
    </script>
</body>
</html>
